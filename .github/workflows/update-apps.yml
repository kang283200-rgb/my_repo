name: Update Repository App Sizes

on:
  push:
    branches:
      - main
    paths:
      - 'repo.json'
      - 'update_apps.py'
      - '.github/workflows/update-apps.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repository-app-sizes
  cancel-in-progress: false

jobs:
  update-app-sizes:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 저장소 파일 확인
        run: |
          echo "현재 작업 경로:"
          pwd

          echo "저장소 최상위 파일 목록:"
          ls -la

          echo "Python 파일 검색:"
          find . -maxdepth 3 -type f -name "update_apps.py"

          echo "파일 존재 여부 확인:"
          test -f ./update_apps.py

      - name: Google Drive API 키 설정 및 실행
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python ./update_apps.py

      - name: 변경된 repo.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo.json

          if ! git diff --cached --quiet; then
            git commit -m "Update IPA file sizes"
            git push
          else
            echo "변경된 내용이 없습니다."
          fi
